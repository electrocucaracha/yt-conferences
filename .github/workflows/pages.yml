name: Publish Knowledge Base
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Kiso
        uses: oak-invest/kiso/applications/kiso-cli-action@117cfc6cb46b8a32cd10f2ad1ae6c2dbafba7dd6 # v0.2.7
        with:
          command: build
          source: docs
          destination: public
      - name: Style portal
        run: python scripts/inject_youtube_stats.py public
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
